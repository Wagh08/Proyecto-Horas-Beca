<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Horas Beca</title>
    <link rel="stylesheet" href="../../src/main/resources/static/css/tema.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="encabezado-login">
        <img
            class="logo-universidad"
            src="../../src/main/resources/static/imgs/LogoUVG.png"
            alt="Universidad del Valle de Guatemala"
        >
        <h1>Horas Beca</h1>
    </header>

    <main class="contenedor-login">
        <h2>Iniciar sesión</h2>
        <p class="descripcion-login">Ingresa con tus datos para continuar.</p>

        <form id="formularioLogin">
            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                placeholder="Ingrese su correo"
                required
            >

            <label for="contraseña">Contraseña</label>
            <input
                type="password"
                id="contraseña"
                placeholder="Ingrese su contraseña"
                required
            >

            <button type="submit">Iniciar sesión</button>
            <p id="mensaje"></p>
        </form>
    </main>

    <script src="login.js"></script>
</body>
</html>
