<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso · Horas Beca</title>
    <link rel="stylesheet" href="../static/css/tema.css" th:href="@{/css/tema.css}">
    <link rel="stylesheet" href="../static/css/navegacion.css" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" href="../static/css/barra-progreso.css" th:href="@{/css/barra-progreso.css}">
    <link rel="stylesheet" href="../static/css/progreso.css" th:href="@{/css/progreso.css}">
    <script src="../static/js/tema.js" th:src="@{/js/tema.js}"></script>
</head>
<body data-rol="estudiante" data-pagina="progreso">
    <header class="cabecera-app">
        <p>Horas Beca</p>
        <h1 id="titulo-pagina"></h1>
    </header>
    <main class="contenido-app pagina-progreso" id="contenido-pagina">
        <section class="tarjeta-progreso" aria-labelledby="titulo-progreso">
            <h2 id="titulo-progreso" th:text="|Tu progreso en ${resumen.anio()}|">Tu progreso</h2>
            <p class="total" th:text="|${resumen.acreditadas()} de ${resumen.meta()} horas|">Horas acreditadas</p>
            <p th:text="|Has completado el ${resumen.porcentaje()} % de tu meta anual.|">Porcentaje completado</p>
            <div class="barra-horas" role="progressbar" aria-label="Horas beca acreditadas" aria-valuemin="0" th:aria-valuemax="${resumen.meta()}" th:aria-valuenow="${resumen.anchoBarra() * resumen.meta() / 100}" th:aria-valuetext="|${resumen.acreditadas()} de ${resumen.meta()} horas acreditadas|">
                <span th:style="|--avance: ${resumen.anchoBarra()}%;|"></span>
            </div>
        </section>

        <section class="cifras-progreso" aria-label="Resumen de horas">
            <div class="cifra-progreso"><strong th:text="|${resumen.pendientes()} h|">0 h</strong><span>Horas pendientes</span></div>
            <div class="cifra-progreso"><strong th:text="|${resumen.acreditadas()} h|">0 h</strong><span>Horas acreditadas</span></div>
        </section>

        <section class="historial" aria-labelledby="titulo-historial">
            <h2 id="titulo-historial" th:text="|Acreditaciones de ${resumen.anio()}|">Acreditaciones</h2>
            <p th:if="${#lists.isEmpty(historial)}">Todavía no tienes horas acreditadas este año.</p>

            <article class="registro-historial" th:each="registro : ${historial}">
                <h3 th:text="${registro.actividad()}">Actividad</h3>
                <p><time th:datetime="${registro.fechaIso()}" th:text="${registro.fechaTexto()}">Fecha</time> · <span th:text="${registro.organizador()}">Organizador</span></p>
                <strong th:text="|+${registro.horas()} horas beca|">Horas</strong>
            </article>
        </section>
    </main>
    <nav class="navegacion-inferior" aria-label="Navegación principal"></nav>
    <script src="../static/js/navegacion.js" th:src="@{/js/navegacion.js}"></script>
</body>
</html>
