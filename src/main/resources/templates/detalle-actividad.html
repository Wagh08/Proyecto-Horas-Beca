<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horas Beca</title>
    <link rel="stylesheet" href="../static/css/tema.css" th:href="@{/css/tema.css}">
    <link rel="stylesheet" href="../static/css/navegacion.css" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" href="../static/css/actividades.css" th:href="@{/css/actividades.css}">
    <script src="../static/js/tema.js" th:src="@{/js/tema.js}"></script>
</head>
<body data-rol="estudiante" data-pagina="actividades">
    <header class="cabecera-app">
        <p>Horas Beca</p>
        <h1 id="titulo-pagina"></h1>
    </header>

    <main class="contenido-app pagina-actividades" id="contenido-pagina">
        <a class="enlace-actividad" href="actividades.html">Volver a actividades</a>

        <article class="tarjeta-actividad">
            <span class="etiqueta-actividad" th:text="|${actividad.horasAcreditables} horas beca|">Horas beca</span>
            <h2 th:text="${actividad.nombre}">Nombre de la actividad</h2>
            <p th:text="${actividad.descripcion}">Descripción</p>
            <dl class="ficha-datos">
                <div><dt>Fecha</dt><dd th:text="${actividad.fechaTexto()}">Fecha</dd></div>
                <div><dt>Horario</dt><dd th:text="|${actividad.horaInicio} a ${actividad.horaFin}|">Horario</dd></div>
                <div><dt>Ubicación</dt><dd th:text="${actividad.ubicacion}">Ubicación</dd></div>
                <div><dt>Organizador</dt><dd th:text="${actividad.organizador}">Organizador</dd></div>
                <div><dt>Cupo máximo</dt><dd th:text="${actividad.cupoMaximo}">Cupo</dd></div>
                <div><dt>Horas acreditables</dt><dd th:text="|${actividad.horasAcreditables} horas beca|">Horas</dd></div>
                <div><dt>Requisitos</dt><dd th:text="${actividad.requisitos != null ? actividad.requisitos : 'Sin requisitos adicionales'}">Requisitos</dd></div>
            </dl>
        </article>
    </main>

    <nav class="navegacion-inferior" aria-label="Navegación principal"></nav>

    <script src="../static/js/navegacion.js" th:src="@{/js/navegacion.js}"></script>
</body>
</html>
