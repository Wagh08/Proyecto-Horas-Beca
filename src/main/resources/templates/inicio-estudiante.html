<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio · Horas Beca</title>
    <link rel="stylesheet" href="../static/css/tema.css" th:href="@{/css/tema.css}">
    <link rel="stylesheet" href="../static/css/navegacion.css" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" href="../static/css/inicio.css" th:href="@{/css/inicio.css}">
    <link rel="stylesheet" href="../static/css/barra-progreso.css" th:href="@{/css/barra-progreso.css}">
    <script src="../static/js/tema.js" th:src="@{/js/tema.js}"></script>
</head>
<body data-rol="estudiante" data-pagina="inicio">
    <header class="cabecera-app">
        <p>Horas Beca</p>
        <h1 id="titulo-pagina"></h1>
    </header>
    <main class="contenido-app inicio" id="contenido-pagina">
        <section class="saludo">
            <h2 th:text="|Hola, ${resumen.nombre()}|">Hola</h2>
            <p>Encuentra tu próxima oportunidad de horas beca.</p>
        </section>

        <section class="resumen-inicio" aria-labelledby="titulo-horas">
            <p id="titulo-horas" th:text="|Tus horas beca en ${resumen.anio()}|">Tus horas beca este año</p>
            <p class="cifra" th:text="|${resumen.acreditadas()} de ${resumen.meta()} horas|">Horas acreditadas</p>
            <p class="detalle" th:text="|Te faltan ${resumen.pendientes()} horas para completar tu meta.|">Horas pendientes</p>
            <div class="barra-horas" role="progressbar" aria-label="Horas beca acreditadas" aria-valuemin="0" th:aria-valuemax="${resumen.meta()}" th:aria-valuenow="${resumen.anchoBarra() * resumen.meta() / 100}" th:aria-valuetext="|${resumen.acreditadas()} de ${resumen.meta()} horas acreditadas|">
                <span th:style="|--avance: ${resumen.anchoBarra()}%;|"></span>
            </div>
            <p th:text="|${resumen.porcentaje()} % completado|">Progreso</p>
            <a th:href="@{/progreso.html}">Ver mi progreso</a>
        </section>

        <section class="seccion-inicio" aria-labelledby="titulo-proximas">
            <h2 id="titulo-proximas">Actividades</h2>
            <p>Consulta las actividades disponibles y tus inscripciones.</p>
            <a th:href="@{/actividades.html}">Ver actividades</a>
        </section>
    </main>
    <nav class="navegacion-inferior" aria-label="Navegación principal"></nav>
    <script src="../static/js/navegacion.js" th:src="@{/js/navegacion.js}"></script>
</body>
</html>
